<!--
==========================================================================
 SLY ESCAPE - a single-file casual "swallow everything" game.

 HOW TO ADD / REMOVE THINGS
 1. FEATURES (just below, top of the <script>): flip a flag true/false.
    Each optional feature is a self-contained module in the MODULES section
    that registers with Game.use({...hooks}). When its flag is false the
    module is never registered, so the core game runs without it.
    Hooks a module may implement:
      init(G)            once at boot          levelStart(G,L)
      update(G,dt)       every frame           swallow(G,obj)  object eaten
      drawWorld(G,ctx)   world-space drawing   drawHud(G,ctx)  screen-space
      levelEnd(G,res)    win/lose result       menu(G,el)      add menu UI
      modifyGrowth(G,obj,amt) -> amt           modifyScore(G,obj,pts) -> pts
    To add a feature: add a flag, then `if(FEATURES.x) Game.use({...})`.
    To remove one entirely: delete its flag and its module block.
 2. LEVELS: 1-6 are hand-made entries; 7-100 come from generateLevels(),
    driven by THEMES (one farm theme per 10 levels), TUNING (difficulty
    ranges, capped so late levels stay beatable) and LEVEL_OVERRIDES (drop a
    hand-made level in by number). One level entry has these fields:
      name, time (sec), goal {type:'clear',pct} or {type:'size',r},
      size [w,h], ground [colA,colB], spawn [[typeId,count],...],
      farmer (chase speed, optional)
 3. OBJECT TYPES: one entry in OBJECT_TYPES. Fields:
      size (radius), pts, shape ('animal'|'ball'|'box'|'tree'|'car'|'house'|'cone'|'silo'|'crop'),
      color, color2 (accent), h (visual height), wander (speed, animals),
      kind (animal look: cat|dog|sheep|chick|duck|pig|goat|cow|horse).
    An object is swallowable only once hole radius > size/0.92, so big
    things (cows, horses, tractors, barns) need a bigger hole.
==========================================================================
-->

<script>
'use strict';
/* ===================== FEATURES: flip to true/false ===================== */
/* ===================== SPEED: easy tweaks =====================
 headSpeed:   how fast the head moves (1 = original speed; 0.67 = builds 1-6; lower = slower).
 chaserSpeed: multiplies every chaser's speed. Chasers move at a per-level multiple of the head's starting speed
              (CHASER ratio, kept from the original balance), so changing headSpeed slows/speeds chasers with it.
 levelTime:   multiplies every level's time limit (1.45 in builds 1-6; 1.6 keeps about the same spare time at the slower head). */
const SPEED={headSpeed:0.52,chaserSpeed:1,levelTime:1.6};
/* ===================== SCOREBOARD: global online leaderboard config =====================
 One shared list per map (score of the map's LAST level) for Android, iPhone and web.
 url + anonKey: from the Supabase project (Settings > API: Project URL + anon/publishable key). The anon key is public by design;
 the database's row-level security + the submit_score function (backend/supabase.sql) are what protect the data.
 Leave url empty to use the built-in local mock (scores only stored on this device), e.g. for tests and offline builds. */
// freeTextNick: true = players type a nickname (rude-word filtered); false = kid-safe mode, only generated names like "SwiftOtter42" (🎲 button).
const SCOREBOARD={url:'https://zyqiemevuvhbirtsbbjf.supabase.co',anonKey:'sb_publishable_DW1cHpXy4yRZafXE3C8brA_-eMmaLv5',topN:10,listN:50,timeoutMs:8000,nickMin:3,nickMax:14,freeTextNick:true};
const PLAYER_SPEED=SPEED.headSpeed;
/* LEVEL_TIME_SCALE: level time limits are multiplied by this to balance slower movement. */
const LEVEL_TIME_SCALE=SPEED.levelTime;
const FARMER_SPEED_SCALE=0.8; // farmer chase speed multiplier (keeps chases fair at the slower PLAYER_SPEED)
/* ===================== BUILD (store release config) =====================
 release:true for App Store / Google Play builds: forces unlockAll off, ignores ?dev=1 (no tester mode),
 and hides the coin shop unless a real billing provider (window.SlyBilling) is attached, so TEST banners never ship.
 Bump version/build for every store upload (also bump CACHE in sw.js so the offline copy updates). */
const BUILD={version:'1.0.0',build:11,release:false,
  supportEmail:'slyescape@mail.grokbot.com',privacyUrl:'privacy.html',supportUrl:'support.html'};
const FEATURES={
  speciesHeads:true, // species-shaped side-view heads (hinged jaws, see-through mouth)
  blankMouth:true, // heads: open mouth is a see-through wedge (no gums/throat/tongue; teeth stay)
  hiFiGraphics:true, // pseudo-3D renderer: lit/cached sprites, cast shadows, graded ground, parallax sky, caustics, swaying grass (off = flat fallback)
  unlockAll:false,   // TESTING ONLY (dev: add ?dev=1 to the URL to turn it on). Tester mode: every level/map/head/chaser playable & equippable (real save untouched; flip off = normal locks)
  timer:true,        // countdown per level (off = untimed; finish by reaching goal)
  sound:true,        // WebAudio sound effects (per-world palette) + mute button
  music:true,        // per-world procedural background music + its own mute button
  combos:true,       // quick successive swallows multiply points
  particles:true,    // little bursts when things fall in
  popText:true,      // floating "+10" text
  stars:true,        // 1-3 star rating per level
  coins:true,        // coins earned per level, saved
  levelSelect:true,  // level select screen
  boosters:true,     // tap-to-use Magnet booster (costs coins if coins on)
  buyTime:true,      // spend coins for more time: 'Keep going?' +15s when the timer runs out, '+10s start' boost on Get Ready (PRICES.buyTime)
  farmer:true,       // a friendly farmer chases your head; swallow him late for a bonus
  howToPlay:true,    // 'How to Play' guide screen from the main menu
  store:true,        // Store: buy extra maps, heads and chasers with coins
  parentalGate:true, // grown-up check (digits written as words) before real-money purchases, restore and outside links
  settings:true,     // Settings screen: sound/music, restore purchases, privacy/support, version
  coinShop:true,     // Store 'Coins' tab: real-money coin packs via IAP (TEST stub until a native billing plugin is attached)
  loadout:true,      // 'Get Ready' screen before a level: pick head + chaser
  leaderboard:true, // global scoreboard for each map's last level (config: SCOREBOARD near the top)
};
// hidden dev switch for testing: ?dev=1 unlocks everything (tester mode, real save untouched); ?dev=0 or no param = normal
if(!BUILD.release&&/[?&]dev=1\b/.test(location.search))FEATURES.unlockAll=true;
if(BUILD.release)FEATURES.unlockAll=false; // store builds never ship tester mode
/* ===================== PERF overlay (hidden, off by default) =====================
 Turn on: Settings -> tap the version line 5 times (or add ?perf=1 to the web URL). Tap the overlay's 'off' to hide it.
 Shows FPS, counts of slow frames (>33ms, >50ms) and the 8 slowest frames with tags saying what happened in them.
 Code marks events with PERF.tag('name'); when the overlay is off that is a single boolean check. */
const FRAMEQ=[];
// warm every font + glyph set the game draws on canvases once at startup, so the first combo/label never waits on font loading
const warmFonts=()=>{try{const c=document.createElement('canvas').getContext('2d');for(const f of ['900 30px system-ui','italic 900 34px system-ui','800 20px system-ui','bold 20px sans-serif','900 20px system-ui','italic 900 20px system-ui'])
  {c.font=f;c.fillText('COMBO x0123456789 Nice! Great! Awesome! INSANE! LEGENDARY! +★✓🔥⭐💥🪙',0,20);c.strokeText('COMBO x0123456789!',0,20)}}catch(e){}};
warmFonts();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(warmFonts); // small deferred jobs run one per frame at the end of light frames
const PERF={on:false,cur:[],slow:[],n:0,n33:0,n50:0,nLoad:0,nPause:0,ivs:new Float32Array(60),ii:0,el:null,body:null,lastUi:0,heap:0,ls:0,skip:0,hid:false,
  // level start: stats reset automatically, and its loading frames are counted as 'level-load' instead of slow frames
  tag(t){if(t==='level-start'){this.ls=performance.now();this.skip=3;if(this.on)this.reset()}if(this.on&&this.cur.indexOf(t)<0)this.cur.push(t)},
  frame(iv,work,lvl){if(!this.on)return;
    // app in background / screen off / paused: not a game hitch
    if(this.hid||iv>1000){this.nPause++;this.hid=false;this.cur.length=0;return}
    if(this.skip>0||performance.now()-this.ls<500){this.skip--;if(iv>33)this.nLoad++;this.cur.length=0;return}
    this.n++;this.ivs[this.ii++%60]=iv;if(iv>33)this.n33++;if(iv>50)this.n50++;
    const m=performance.memory;if(m){const h=m.usedJSHeapSize;if(this.heap&&h<this.heap-1e6)this.tag('GC');this.heap=h}
    if(iv>33){const tags=this.cur.length?this.cur.join(' '):(work<iv*0.5?'idle-gap (GC/system?)':'draw');this.slow.push({iv:Math.round(iv),w:Math.round(work),tags,lvl,at:Math.round(performance.now()/100)/10});
      this.slow.sort((a,b)=>b.iv-a.iv);if(this.slow.length>8)this.slow.length=8}
    this.cur.length=0;const now=performance.now();if(now-this.lastUi>500){this.lastUi=now;this.ui()}},
  ui(){if(!this.el){const d=document.createElement('div');d.id='perfBox';
      d.style.cssText='position:fixed;left:4px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:99999;background:rgba(0,0,0,.8);color:#fff;font:11px/1.35 monospace;padding:6px;border-radius:8px;width:max-content;max-width:calc(100vw - 8px);box-sizing:border-box;pointer-events:auto;white-space:pre-wrap;word-break:break-word';
      const bs='display:inline-block;font:bold 14px system-ui;padding:9px 16px;margin:0 8px 6px 0;border-radius:8px;border:0;color:#111;';
      d.innerHTML='<button data-k="reset" style="'+bs+'background:#ffd23f">Reset</button><button data-k="off" style="'+bs+'background:#ff8080">Off</button><div></div>';
      d.onclick=e=>{e.stopPropagation();const k=e.target.dataset&&e.target.dataset.k;if(k==='off')PERF.set(false);else if(k==='reset')PERF.reset()};
      document.body.appendChild(d);this.el=d;this.body=d.lastChild}
    let a=0;const k=Math.min(60,this.n);for(let i=0;i<k;i++)a+=this.ivs[i];const fps=k?Math.round(1000/(a/k)):0;
    this.body.textContent='FPS '+fps+' · '+this.n+' frames\n>33ms '+this.n33+' · >50ms '+this.n50+'\nload '+this.nLoad+' · paused '+this.nPause+' · res '+(G.dpr||0).toFixed(2)+'x · b'+BUILD.build+'\n'+(G.L?G.L.name:'-')+'\nslowest (total/work ms, what):\n'+
      (this.slow.map(f=>f.iv+'/'+f.w+' '+f.tags+' @'+f.at+'s').join('\n')||'(none yet)')},
  reset(){this.slow=[];this.n=this.n33=this.n50=this.nLoad=this.nPause=0;this.ivs.fill(0);this.ii=0;if(this.el)this.ui()},
  set(v){this.on=v;try{localStorage.setItem('slyescape.perf',v?'1':'0')}catch(e){}if(v){this.reset();this.ui()}else if(this.el){this.el.remove();this.el=this.body=null}}};
{const h=()=>{PERF.hid=true};document.addEventListener('visibilitychange',h);document.addEventListener('pause',h);document.addEventListener('resume',h);window.addEventListener('pageshow',h)}
try{PERF.on=localStorage.getItem('slyescape.perf')==='1'||/[?&]perf=1\b/.test(location.search)}catch(e){}
/* ===================== PARENTAL GATE (FEATURES.parentalGate) =====================
 Shown before any real-money purchase, restore, and before leaving the game (privacy/support pages).
 Adult-solvable: three random digits are written out as words ("seven · two · four") and must be typed on a keypad.
 Pre-readers can't solve it; 3 wrong tries close the gate. GATE.ask(reason) -> Promise<boolean>. */
const GATE={WORDS:['zero','one','two','three','four','five','six','seven','eight','nine'],
  ask(reason){if(!FEATURES.parentalGate)return Promise.resolve(true);return new Promise(res=>{
    const el=document.createElement('div');el.id='pGate';let code=[],typed='',fails=0;
    const msg={purchase:'A grown-up needs to approve purchases.',restore:'A grown-up needs to approve restoring purchases.',link:'This opens a page outside the game.'}[reason]||'Grown-ups only.';
    el.innerHTML='<div class="pgBox"><div class="pgT">👋 Ask a grown-up</div><div class="pgM">'+msg+'</div><div class="pgQ">Grown-ups: type these numbers</div><div class="pgW" id="pgW"></div><div class="pgD" id="pgD"></div><div class="pgE" id="pgE"></div><div class="pgK" id="pgK"></div><button class="btn alt pgC" id="pgC">Cancel</button></div>';
    document.body.appendChild(el);
    const fresh=()=>{code=[];while(code.length<3){const d=Math.floor(Math.random()*10);if(!code.includes(d))code.push(d)}typed='';el.querySelector('#pgW').textContent=code.map(d=>GATE.WORDS[d]).join(' · ');draw()};
    const draw=()=>{el.querySelector('#pgD').innerHTML=[0,1,2].map(i=>'<span>'+(typed[i]!=null?typed[i]:'')+'</span>').join('')};
    const done=v=>{el.remove();GATE._cur=null;res(v)};
    const key=k=>{if(k==='⌫'){typed=typed.slice(0,-1);draw();return}if(typed.length>=3)return;typed+=k;draw();
      if(typed.length===3){if(typed===code.join(''))return setTimeout(()=>done(true),120);fails++;el.querySelector('#pgE').textContent=fails>=3?'':'Not quite, try again.';el.querySelector('.pgBox').classList.add('shake');
        setTimeout(()=>{el.querySelector('.pgBox').classList.remove('shake');if(fails>=3)done(false);else fresh()},420)}};
    const K=el.querySelector('#pgK');for(const k of ['1','2','3','4','5','6','7','8','9','','0','⌫']){const b=document.createElement('button');b.textContent=k;if(!k)b.style.visibility='hidden';b.onclick=e=>{e.stopPropagation();key(k)};K.appendChild(b)}
    el.querySelector('#pgC').onclick=()=>done(false);GATE._cur={code:()=>code.join(''),el};fresh()})}};
/* ===================== PRICES (single editable registry) =====================
 Every price in the game lives here. An item's price is a tier name (see tiers) or a plain coin number.
 Measured earn rate (greedy test bot, near-perfect play, 85 wins sampled incl. combo coins):
   worlds 1-4 ~68 coins/win, worlds 5-10 ~112/win, theme maps ~74/win (10 per star + score/100 + up to 10 combo coins).
 Planning rate for a typical kid (~2 stars, fewer combos): ~60 coins per level won.
   common     250  ~ 4 levels      rare       600  ~10 levels
   epic       900  ~15 levels      legendary 2400  ~40 levels
 Head frame glow colour in the store/loadout follows the tier (free+common blue, rare cyan, epic purple, legendary gold).
 free: what a new player owns. Farm worlds 1..free.farmWorlds are free (levels unlock by progression);
 later farm worlds are bought in order. Theme maps: buy any. 'default' chaser = the level's own chaser (Farmer on the farm). */
const PRICES={
  tiers:{common:250,rare:600,epic:900,legendary:2400},
  free:{heads:['default'],chasers:['default'],farmWorlds:4},
  farmWorlds:{5:500,6:750,7:1000,8:1250,9:1500,10:2000},
  maps:{minigolf:600,candy:600,ocean:900,moon:900,toys:900,west:900,dino:1500,pirate:1500,space:2400,haunted:2400},

   init(skus) -> Promise<[{sku,price}]>   (localized price strings)
   purchase(sku) -> Promise<{ok, transactionId, receipt}>
   finish(result)                          (acknowledge/consume after coins are granted)
 Validate receipts server-side before granting in production. Coins are only granted by IAP.grant(sku). */
const IAP={
  get TEST(){return !this.provider},provider:null,prices:{},
  products(){return[...PRICES.coinPacks,PRICES.starterPack]},
  product(sku){return this.products().find(p=>p.sku===sku)},
  priceLabel(p){return this.prices[p.sku]||('$'+p.usd.toFixed(2))},
  owned(sku){return !!((G.save.iap||{})[sku])},
  async init(){this.provider=this.provider||window.SlyBilling||null;if(this.provider&&this.provider.init){try{const l=await this.provider.init(this.products().map(p=>p.sku));(l||[]).forEach(x=>this.prices[x.sku]=x.price)}catch(e){console.warn('IAP init',e)}}},
  // one purchase flow at a time (a double tap must not open two gates / charge twice)
  async purchase(sku){if(this.busy)return{ok:false,error:'busy'};this.busy=true;try{return await this._purchase(sku)}finally{this.busy=false}},
  async _purchase(sku){const p=this.product(sku);if(!p)return{ok:false,error:'unknown sku'};if(p.oneTime&&this.owned(sku))return{ok:false,error:'owned'};
    if(!(await GATE.ask('purchase')))return{ok:false,cancelled:true,gate:true};
    if(!this.provider&&BUILD.release)return{ok:false,error:'store unavailable'};
    if(this.provider){const r=await this.provider.purchase(sku);if(r&&r.ok){this.grant(sku);this.provider.finish&&this.provider.finish(r)}return r||{ok:false}}
    const ok=await this.testConfirm(p);if(!ok)return{ok:false,cancelled:true};this.grant(sku);return{ok:true,sku,test:true}},
  testConfirm(p){return new Promise(res=>{const st=G.store;if(!st)return res(window.confirm('Test purchase - no money charged'));
    st.confirm('🧪 TEST purchase','<b>Test purchase - no money charged.</b><br><br>'+p.icon+' '+p.name+': 🪙 '+p.coins.toLocaleString('en-US')+((p.heads||[]).length?' + '+p.heads.map(h=>HEADS[h].name).join(', '):'')+((p.chasers||[]).length?' + '+p.chasers.map(c=>CHASERS[c].name).join(', '):'')+'<br>Normally '+this.priceLabel(p)+'.',()=>res(true),()=>res(false),'Buy (test)')})},
  // restore: only the one-time Starter Pack is restorable (coin packs are consumables). Provider: restore() -> Promise<{skus:[...]}>
  async restore(){if(!(await GATE.ask('restore')))return{ok:false,cancelled:true};if(!this.provider||!this.provider.restore)return{ok:true,restored:0,test:!this.provider};
    const r=await this.provider.restore();let n=0;for(const sku of (r&&r.skus)||[]){const p=this.product(sku);if(p&&p.oneTime&&!this.owned(sku)){this.grant(sku);n++}}return{ok:true,restored:n}},
  grant(sku){const p=this.product(sku),S=G.save;if(!p)return;S.coins=(S.coins||0)+p.coins;S.iap=S.iap||{};S.iap[sku]=(S.iap[sku]||0)+1;
    (p.heads||[]).forEach(h=>{(S.ownedHeads=S.ownedHeads||{})[h]=true});(p.chasers||[]).forEach(c=>{(S.ownedChasers=S.ownedChasers||{})[c]=true});G.persist();G.hook('coinsChanged')},
};
