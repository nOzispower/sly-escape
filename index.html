<title>Sly Escape</title>
<!--
==========================================================================
 SLY ESCAPE - a single-file casual "swallow everything" game.

 HOW TO ADD / REMOVE THINGS
 1. FEATURES (just below, top of the <script>): flip a flag true/false.
    Each optional feature is a self-contained module in the MODULES section
    that registers with Game.use({...hooks}). When its flag is false the
    module is never registered, so the core game runs without it.
    Hooks a module may implement:
      init(G)            once at boot          levelStart(G,L)
      update(G,dt)       every frame           swallow(G,obj)  object eaten
      drawWorld(G,ctx)   world-space drawing   drawHud(G,ctx)  screen-space
      levelEnd(G,res)    win/lose result       menu(G,el)      add menu UI
      modifyGrowth(G,obj,amt) -> amt           modifyScore(G,obj,pts) -> pts
    To add a feature: add a flag, then `if(FEATURES.x) Game.use({...})`.
    To remove one entirely: delete its flag and its module block.
 2. LEVELS: 1-6 are hand-made entries; 7-100 come from generateLevels(),
    driven by THEMES (one farm theme per 10 levels), TUNING (difficulty
    ranges, capped so late levels stay beatable) and LEVEL_OVERRIDES (drop a
    hand-made level in by number). One level entry has these fields:
      name, time (sec), goal {type:'clear',pct} or {type:'size',r},
      size [w,h], ground [colA,colB], spawn [[typeId,count],...],
      farmer (chase speed, optional)
 3. OBJECT TYPES: one entry in OBJECT_TYPES. Fields:
      size (radius), pts, shape ('animal'|'ball'|'box'|'tree'|'car'|'house'|'cone'|'silo'|'crop'),
      color, color2 (accent), h (visual height), wander (speed, animals),
      kind (animal look: cat|dog|sheep|chick|duck|pig|goat|cow|horse).
    An object is swallowable only once hole radius > size/0.92, so big
    things (cows, horses, tractors, barns) need a bigger hole.
==========================================================================
-->

        const view=G.chaserPreview?G.chaserPreview(id,96,64,anim):(()=>{const c=document.createElement('canvas');return c})();

      G.show('sLoad');if(!raf)raf=requestAnimationFrame(loop);
      setTimeout(()=>{for(const r of[hr,cr]){const s=r.querySelector('.sel');if(s)r.scrollLeft=s.offsetLeft-r.offsetLeft-10}},0)},
    play(){G.startLevel(this.level)}};
