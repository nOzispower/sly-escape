<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sly Escape</title>
<!--
==========================================================================
 SLY ESCAPE - a single-file casual "swallow everything" game.

 HOW TO ADD / REMOVE THINGS
 1. FEATURES (just below, top of the <script>): flip a flag true/false.
    Each optional feature is a self-contained module in the MODULES section
    that registers with Game.use({...hooks}). When its flag is false the
    module is never registered, so the core game runs without it.
    Hooks a module may implement:
      init(G)            once at boot          levelStart(G,L)
      update(G,dt)       every frame           swallow(G,obj)  object eaten
      drawWorld(G,ctx)   world-space drawing   drawHud(G,ctx)  screen-space
      levelEnd(G,res)    win/lose result       menu(G,el)      add menu UI
      modifyGrowth(G,obj,amt) -> amt           modifyScore(G,obj,pts) -> pts
    To add a feature: add a flag, then `if(FEATURES.x) Game.use({...})`.
    To remove one entirely: delete its flag and its module block.
 2. LEVELS: 1-6 are hand-made entries; 7-100 come from generateLevels(),
    driven by THEMES (one farm theme per 10 levels), TUNING (difficulty
    ranges, capped so late levels stay beatable) and LEVEL_OVERRIDES (drop a
    hand-made level in by number). One level entry has these fields:
      name, time (sec), goal {type:'clear',pct} or {type:'size',r},
      size [w,h], ground [colA,colB], spawn [[typeId,count],...],
      farmer (chase speed, optional)
 3. OBJECT TYPES: one entry in OBJECT_TYPES. Fields:
      size (radius), pts, shape ('animal'|'ball'|'box'|'tree'|'car'|'house'|'cone'|'silo'|'crop'),
      color, color2 (accent), h (visual height), wander (speed, animals),
      kind (animal look: cat|dog|sheep|chick|duck|pig|goat|cow|horse).
    An object is swallowable only once hole radius > size/0.92, so big
    things (cows, horses, tractors, barns) need a bigger hole.
==========================================================================
-->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#1a1240;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;
 background:radial-gradient(circle at 50% 30%,#7b3cff,#2a0f6b 70%);color:#fff;text-align:center;z-index:5}
.scr.on{display:flex}
h1{font-size:46px;font-weight:900;letter-spacing:1px;text-shadow:0 4px 0 #ff2fa0,0 8px 18px #0008;transform:rotate(-3deg)}
h2{font-size:30px;font-weight:900;text-shadow:0 3px 0 #ff2fa0}
.btn{border:0;border-radius:18px;padding:14px 34px;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(#ffcf33,#ff8a00);
 box-shadow:0 6px 0 #b35500,0 10px 20px #0006;cursor:pointer;min-width:200px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b35500}
.btn.alt{background:linear-gradient(#4fe3ff,#1e8cff);box-shadow:0 6px 0 #0a4fa8,0 10px 20px #0006}
.grid{display:grid;grid-template-columns:repeat(5,58px);gap:10px}
.grid .lv{height:66px;font-size:22px;border-radius:14px}.grid .lv small{font-size:10px;bottom:4px}
.grid .lv.bonus{background:linear-gradient(#ffcf33,#ff8a00);box-shadow:0 5px 0 #b35500}
.wnav{display:flex;align-items:center;gap:10px}.wnav .ic{background:#fff3}
#wTitle{min-width:190px;font-size:20px;font-weight:900}#wStars{font-size:15px;color:#ffe14d}
.dots{display:flex;gap:5px}.dots i{width:8px;height:8px;border-radius:50%;background:#fff4}.dots i.on{background:#ffe14d}
.lv{height:86px;border-radius:18px;border:0;font-size:28px;font-weight:900;color:#fff;background:linear-gradient(#5dff9a,#14b35c);box-shadow:0 5px 0 #0a6b37;position:relative}
.lv small{position:absolute;bottom:6px;left:0;right:0;font-size:13px;color:#ffe14d}
.lv[disabled]{background:#5a4a8a;box-shadow:0 5px 0 #3a2d63;color:#9c8fc7}
#hudTop{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:none;z-index:3;color:#fff;font-weight:900;pointer-events:none}
#hudTop.on{display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:#0007;border-radius:14px;padding:5px 12px;font-size:17px;white-space:nowrap}
#bar{height:16px;background:#0007;border-radius:10px;margin-top:8px;overflow:hidden;border:2px solid #fff8}
#barFill{height:100%;width:0;background:linear-gradient(90deg,#ff2fa0,#ffcf33);transition:width .2s}
#tools{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:8px;z-index:4}
.ic{width:52px;height:52px;border-radius:50%;border:0;background:#0008;color:#fff;font-size:24px;font-weight:900}
.stars{font-size:44px;letter-spacing:6px;color:#ffe14d;text-shadow:0 3px 0 #b37b00}
.dim{opacity:.85;font-size:16px}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hudTop"><div class="row"><span class="pill" id="hLv">Lv 1</span><span class="pill" id="hScore">0</span><span class="pill" id="hTime"></span></div>
<div id="bar"><div id="barFill"></div></div><div class="row" id="hudExtra" style="margin-top:6px"></div></div>
<div id="tools"></div>
<div class="scr on" id="sMenu"><h1>SLY<br>ESCAPE</h1><div class="dim">Drag anywhere to steer. Swallow the farm, grow bigger!</div>
 <button class="btn" id="bPlay">PLAY</button><div id="menuExtra" style="display:flex;flex-direction:column;gap:12px;align-items:center"></div></div>
<div class="scr" id="sSelect"><h2>Levels</h2><div class="wnav"><button class="ic" id="wPrev">‹</button><div><div id="wTitle"></div><div id="wStars"></div></div><button class="ic" id="wNext">›</button></div>
 <div class="grid" id="lvGrid"></div><div class="dots" id="wDots"></div><button class="btn alt" id="bBack">Back</button></div>
<div class="scr" id="sEnd"><h2 id="eTitle"></h2><div class="stars" id="eStars"></div><div id="eMsg" class="dim"></div><div id="endExtra"></div>
 <button class="btn" id="bNext">Next</button><button class="btn alt" id="bRetry">Retry</button><button class="btn alt" id="bMenu">Menu</button></div>
<script>
'use strict';
/* ===================== FEATURES: flip to true/false ===================== */
const FEATURES={
  timer:true,        // countdown per level (off = untimed; finish by reaching goal)
  sound:true,        // WebAudio sound effects (per-world palette) + mute button
  music:true,        // per-world procedural background music + its own mute button
  combos:true,       // quick successive swallows multiply points
  particles:true,    // little bursts when things fall in
  popText:true,      // floating "+10" text
  stars:true,        // 1-3 star rating per level
  coins:true,        // coins earned per level, saved
  levelSelect:true,  // level select screen
  boosters:true,     // tap-to-use Magnet booster (costs coins if coins on)
  farmer:true,       // a friendly farmer chases the hole; swallow him late for a bonus
  leaderboard:false, // local stub for best scores (swap in a server later)
};
/* ===================== DATA: object types ===================== */
const OBJECT_TYPES={
  // --- animals (cute, wander a little) ---
  chick: {size:6, pts:6, shape:'animal',kind:'chick',color:'#ffe14d',color2:'#ff9a1f',h:8, wander:18},
  duck:  {size:8, pts:8, shape:'animal',kind:'duck', color:'#ffffff',color2:'#ff9a1f',h:10,wander:16},
  cat:   {size:9, pts:10,shape:'animal',kind:'cat',  color:'#ffa04d',color2:'#ffd9a8',h:11,wander:22},
  dog:   {size:11,pts:12,shape:'animal',kind:'dog',  color:'#c98a4e',color2:'#7a4a20',h:13,wander:24},
  sheep: {size:14,pts:16,shape:'animal',kind:'sheep',color:'#fafafa',color2:'#3a3a4a',h:15,wander:12},
  pig:   {size:14,pts:16,shape:'animal',kind:'pig',  color:'#ffb3c8',color2:'#ff7aa0',h:14,wander:14},
  goat:  {size:13,pts:15,shape:'animal',kind:'goat', color:'#e8dcc8',color2:'#8a7050',h:15,wander:18},
  cow:   {size:26,pts:45,shape:'animal',kind:'cow',  color:'#ffffff',color2:'#2a2a33',h:26,wander:10},
  horse: {size:30,pts:55,shape:'animal',kind:'horse',color:'#a0603a',color2:'#4a2a14',h:30,wander:14},
  // --- farm stuff ---
  crop:  {size:7, pts:4, shape:'crop', color:'#4fcf3a',color2:'#ff9a1f',h:10},
  pumpkin:{size:12,pts:10,shape:'ball',color:'#ff8a1f',color2:'#3c8f2a',h:10},
  fence: {size:12,pts:8, shape:'box',  color:'#e8b070',color2:'#a0602a',h:12},
  hay:   {size:16,pts:14,shape:'box',  color:'#ffd84d',color2:'#d9a020',h:16},
  tree:  {size:24,pts:30,shape:'tree', color:'#3fd45a',color2:'#8a5520',h:40},
  tractor:{size:32,pts:60,shape:'car', color:'#2fbf4a',color2:'#ffe14d',h:22},
  silo:  {size:36,pts:80,shape:'silo', color:'#d8dde8',color2:'#e0413a',h:70},
  apple: {size:9, pts:7, shape:'ball', color:'#ff4433',color2:'#3c8f2a',h:9},
  orange:{size:11,pts:9, shape:'ball', color:'#ff9a1f',color2:'#3c8f2a',h:10},
  grapes:{size:9, pts:8, shape:'ball', color:'#9a4fe0',color2:'#3c8f2a',h:8},
  snowball:{size:11,pts:9,shape:'ball', color:'#f4f8ff',color2:'#ff9a1f',h:10},
  pine:  {size:22,pts:28,shape:'tree', color:'#1f9a6a',color2:'#6a4020',h:44},
  lantern:{size:8,pts:8, shape:'cone', color:'#ffd23f',color2:'#ff5a3a',h:14},
  balloon:{size:10,pts:10,shape:'ball',color:'#ff4fd8',color2:'#ffffff',h:12},
  wagon: {size:28,pts:50,shape:'car',  color:'#c98a3e',color2:'#ffd84d',h:20},
  barn:  {size:58,pts:150,shape:'house',color:'#e0413a',color2:'#8a1f1f',h:50},
};
/* ===================== DATA: themes + level generator =====================
 Levels 7-100 are generated (deterministically) from THEMES, one theme per 10
 levels. Edit a theme to restyle a world; edit TUNING to change the curve.
 Every 10th level is a "bonus" breather (lots of small animals, slow farmer).
 To hand-make any level instead, put an object in LEVEL_OVERRIDES[levelNumber]. */
const THEMES=[
 {name:'Meadow',   ground:['#9be86a','#8bdc5a'],mix:{chick:3,duck:2,cat:3,dog:3,sheep:2,crop:2,pumpkin:1,fence:1,cow:1}},
 {name:'Pond',     ground:['#8fe0a0','#7fd290'],mix:{duck:5,chick:2,cat:2,dog:2,goat:1,sheep:2,crop:1,fence:1,hay:1,horse:1}},
 {name:'Orchard',  ground:['#a8e870','#98da60'],mix:{cat:3,dog:3,sheep:2,pig:2,goat:1,cow:1,orange:2,apple:2,tree:2,hay:1}},
 {name:'Pumpkin Patch',ground:['#e8d27a','#dcc46a'],mix:{cat:3,dog:2,sheep:2,pig:3,goat:1,cow:1,pumpkin:4,hay:2,tractor:1}},
 {name:'Barnyard', ground:['#9fe07a','#8fd26a'],mix:{chick:3,cat:2,dog:2,sheep:3,pig:2,cow:2,horse:1,fence:2,hay:1,silo:0.5,barn:0.5}},
 {name:'Vineyard', ground:['#c8d880','#b8ca70'],mix:{cat:3,dog:2,goat:3,sheep:2,horse:1,cow:1,grapes:4,fence:2,wagon:1,barn:0.4}},
 {name:'Snowy Farm',ground:['#eef4ff','#dde8f8'],mix:{sheep:4,dog:3,cat:2,goat:2,horse:1,cow:1,snowball:4,pine:2,hay:1,silo:0.4}},
 {name:'Night Farm',ground:['#4a7a6a','#3f6c5e'],night:true,mix:{cat:4,dog:3,sheep:2,pig:2,cow:1,horse:1,lantern:3,hay:1,tractor:1,barn:0.4}},
 {name:'Harvest Fair',ground:['#ffd98a','#f5cc78'],mix:{chick:2,cat:3,dog:3,pig:2,sheep:2,cow:1,horse:1,balloon:4,pumpkin:2,wagon:1,tractor:0.6,barn:0.4}},
 {name:'Giant Ranch',ground:['#b8e070','#a8d260'],mix:{dog:3,cat:2,sheep:3,goat:2,pig:2,cow:2,horse:2,hay:2,tree:1,tractor:1,silo:0.6,barn:0.6}},
];
const TUNING={ // [easiest, hardest-cap]
 time:[60,95], clearPct:[60,74], sizeFrac:[0.55,0.72], density:[1/8500,1/6500],
 mapSize:[700,1350], farmerSpeed:[55,105], farmerStun:[0.8,1.4], farmerCool:[3.2,2.0],
};
const LEVEL_OVERRIDES={};
function generateLevels(from,to){const out=[],lerp=(a,t)=>a[0]+(a[1]-a[0])*Math.max(0,Math.min(1,t));
  for(let n=from;n<=to;n++){if(LEVEL_OVERRIDES[n]){out.push(LEVEL_OVERRIDES[n]);continue}
    const w=Math.floor((n-1)/10),th=THEMES[w%THEMES.length],inW=(n-1)%10,bonus=n%10===0;
    // smooth ramp with a small plateau at the start of each world, breather on bonus levels
    let d=Math.min(1,((n-1)/99)*0.9+Math.min(inW,7)/7*0.1-(inW<2?0.03:0));if(bonus)d*=0.55;
    let seed=n*7919;const rn=()=>((seed=Math.imul(seed^seed>>>13,1274126177)+12345>>>0)/4294967296);
    const W=Math.round(lerp(TUNING.mapSize,d)/10)*10,H=Math.round(W*1.2/10)*10;
    const count=Math.round(W*H*lerp(TUNING.density,d)*(bonus?1.3:1));
    let mix=Object.entries(th.mix);if(bonus)mix=mix.filter(([k])=>OBJECT_TYPES[k].shape==='animal'&&OBJECT_TYPES[k].size<20);
    const tw=mix.reduce((a,[,v])=>a+v,0),spawn=mix.map(([k,v])=>[k,Math.max(1,Math.round(count*v/tw*(0.85+rn()*0.3)))]);
    const sizeGoal=!bonus&&(n%3===0);let goal;
    if(sizeGoal){const mass=spawn.reduce((a,[k,c])=>a+c*OBJECT_TYPES[k].size**2,0);
      goal={type:'size',r:Math.round(Math.sqrt(256+0.09*mass*lerp(TUNING.sizeFrac,d)))}}
    else goal={type:'clear',pct:Math.round(lerp(TUNING.clearPct,d))};
    out.push({name:(bonus?'★ Bonus: ':'')+th.name+' '+(inW+1),world:w,theme:th.name,night:!!th.night,bonus,
      time:Math.round(lerp(TUNING.time,d)*(bonus?1.2:1)),goal,size:[W,H],ground:th.ground,spawn,
      farmer:Math.round(lerp(TUNING.farmerSpeed,d)),farmerStun:+lerp(TUNING.farmerStun,d).toFixed(2),farmerCool:+lerp(TUNING.farmerCool,d).toFixed(2)})}
  return out}
/* ===================== DATA: levels ===================== */
const LEVELS=[
 {theme:'Meadow',name:'Sunny Meadow',time:60,goal:{type:'clear',pct:60},size:[700,900],ground:['#9be86a','#8bdc5a'],spawn:[['chick',14],['duck',10],['cat',14],['dog',10],['sheep',8],['crop',14],['pumpkin',6]],farmer:55},
 {name:'Duck Pond Patch',time:70,goal:{type:'clear',pct:65},size:[800,1000],ground:['#a7ea6a','#97dc5a'],spawn:[['duck',14],['chick',10],['cat',12],['dog',12],['sheep',10],['pig',8],['crop',12],['fence',10],['hay',6]],farmer:62},
 {name:'Hay Bale Hill',time:80,goal:{type:'size',r:44},size:[900,1100],ground:['#c8e86a','#b8da5a'],spawn:[['cat',14],['dog',14],['sheep',16],['goat',10],['pig',8],['cow',4],['hay',14],['fence',10],['tree',8]],farmer:70},
 {name:'Pumpkin Fields',time:85,goal:{type:'clear',pct:70},size:[950,1150],ground:['#e8d27a','#dcc46a'],spawn:[['cat',16],['dog',14],['sheep',14],['pig',12],['goat',10],['cow',6],['pumpkin',16],['hay',10],['tractor',4],['tree',6]],farmer:78},
 {name:'Big Red Barnyard',time:95,goal:{type:'clear',pct:72},size:[1050,1250],ground:['#9fe07a','#8fd26a'],spawn:[['chick',14],['cat',14],['dog',14],['sheep',16],['pig',10],['cow',10],['horse',6],['fence',14],['hay',10],['tractor',5],['silo',3],['barn',3]],farmer:86},
 {name:'Harvest Festival',time:100,goal:{type:'size',r:64},size:[1150,1400],ground:['#ffd98a','#f5cc78'],spawn:[['cat',16],['dog',16],['sheep',18],['goat',10],['pig',10],['cow',12],['horse',8],['crop',12],['hay',12],['tree',10],['tractor',6],['silo',4],['barn',5]],farmer:95},
 ...generateLevels(7,100), // levels 7-100 come from THEMES + generateLevels below
];
/* ===================== CORE ===================== */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const TILT=0.78; // pseudo-3D vertical squash
const SAVE_KEY='slyescape.v1';
const Game={
  mods:[],use(m){this.mods.push(m);return m},
  hook(n,...a){for(const m of this.mods)if(m[n])m[n](this,...a)},
  pipe(n,v,...a){for(const m of this.mods)if(m[n])v=m[n](this,...a,v);return v},
  save:Object.assign({unlocked:1,best:{},stars:{},coins:0},JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')),
  persist(){localStorage.setItem(SAVE_KEY,JSON.stringify(this.save))},
  state:'menu',W:0,H:0,dpr:1,input:{x:0,y:0,active:false,sx:0,sy:0},auto:null,
  fx:[],t:0,
};
const G=Game;window.HG=Game;G.FEATURES=FEATURES;G.LEVELS=LEVELS;G.OBJECT_TYPES=OBJECT_TYPES;
function resize(){G.dpr=Math.min(3,devicePixelRatio||1);G.W=innerWidth;G.H=innerHeight;cv.width=G.W*G.dpr;cv.height=G.H*G.dpr}
addEventListener('resize',resize);resize();
function rnd(a,b){return a+Math.random()*(b-a)}
G.show=id=>{document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));$('hudTop').classList.toggle('on',!id)};
G.startLevel=function(i){
  const L=LEVELS[i];G.li=i;G.L=L;G.score=0;G.eaten=0;G.timeLeft=L.time;G.elapsed=0;G.over=false;
  G.hole={x:L.size[0]/2,y:L.size[1]/2,r:16,tr:16,stun:0,speed:230};
  G.objs=[];G.falling=[];G.fx=[];
  for(const [id,n] of L.spawn)for(let k=0;k<n;k++){const T=OBJECT_TYPES[id];let x,y,tries=0;
    do{x=rnd(T.size+10,L.size[0]-T.size-10);y=rnd(T.size+10,L.size[1]-T.size-10);tries++}
    while(tries<20&&(Math.hypot(x-G.hole.x,y-G.hole.y)<70||G.objs.some(o=>Math.hypot(o.x-x,o.y-y)<o.size+T.size)));
    G.objs.push({id,T,x,y,size:T.size,rot:rnd(0,6.28)})}
  G.total=G.objs.length;G.cam={x:G.hole.x,y:G.hole.y};G.state='play';G.show(null);
  $('hLv').textContent='Lv '+(i+1)+' · '+L.name;
  G.hook('levelStart',L);
};
G.progress=function(){const g=G.L.goal;return g.type==='clear'?Math.min(1,G.eaten/G.total/(g.pct/100)):Math.min(1,(G.hole.r-16)/(g.r-16))};
G.addFx=(f)=>G.fx.push(f);
G.eat=function(o){
  G.objs.splice(G.objs.indexOf(o),1);o.t=0;G.falling.push(o);
  if(!o.noCount)G.eaten++;
  let pts=G.pipe('modifyScore',o.pts||o.T.pts,o);G.score+=Math.round(pts);
  const grow=G.pipe('modifyGrowth',o.size*o.size*0.09,o);
  G.hole.tr=Math.sqrt(G.hole.tr*G.hole.tr+grow);
  o.lastPts=Math.round(pts);G.hook('swallow',o);
};
G.endLevel=function(win){
  if(G.over)return;G.over=true;G.state='end';
  const res={win,score:G.score,level:G.li,stars:win?1:0,msg:''};
  G.hook('levelEnd',res);
  if(win){G.save.unlocked=Math.max(G.save.unlocked,Math.min(LEVELS.length,G.li+2));
    G.save.best[G.li]=Math.max(G.save.best[G.li]||0,G.score);G.save.stars[G.li]=Math.max(G.save.stars[G.li]||0,res.stars);G.persist()}
  $('eTitle').textContent=win?'LEVEL CLEAR!':(FEATURES.timer?"TIME'S UP!":'TRY AGAIN');
  $('eStars').textContent=FEATURES.stars&&win?'★'.repeat(res.stars)+'☆'.repeat(3-res.stars):'';
  $('eMsg').innerHTML='Score '+G.score+(res.msg?'<br>'+res.msg:'');
  $('bNext').style.display=win&&G.li<LEVELS.length-1?'':'none';
  setTimeout(()=>G.show('sEnd'),win?500:200);
};
function update(dt){
  const h=G.hole,L=G.L;G.elapsed+=dt;
  let vx=0,vy=0;
  if(G.auto){const a=G.auto(G);vx=a.x;vy=a.y}
  else if(G.input.active){vx=G.input.x;vy=G.input.y}
  const m=Math.hypot(vx,vy);if(m>1){vx/=m;vy/=m}
  if(h.stun>0){h.stun-=dt;vx=vy=0}
  const sp=h.speed+h.r*1.2;h.x+=vx*sp*dt;h.y+=vy*sp*dt;

      if(!F.edible&&F.cool<=0&&d<h.r+F.size*0.6){h.stun=G.L.farmerStun||1;h.tr=Math.max(16,h.tr*0.93);F.cool=G.L.farmerCool||3;G.hook('stunned');
        G.addFx({x:h.x,y:h.y,t:0,life:1,draw(c,f){const[sx,sy]=G.toScreen(f.x,f.y);c.globalAlpha=1-f.t;c.font='900 24px system-ui';c.textAlign='center';c.fillStyle='#fff';c.strokeStyle='#2a0f6b';c.lineWidth=4;c.strokeText('Shoo! 💫',sx,sy-40-f.t*30);c.fillText('Shoo! 💫',sx,sy-40-f.t*30);c.globalAlpha=1}})}},
    swallow(G,o){if(o===F){G.hook('bigBonus');G.addFx({t:0,life:1.5,draw(c,f){c.save();c.globalAlpha=Math.min(1,2*(1-f.t/f.life));c.font='900 34px system-ui';c.textAlign='center';c.fillStyle='#ffe14d';c.strokeStyle='#ff2fa0';c.lineWidth=6;
      c.strokeText('FARMER BONUS!',G.W/2,G.H*0.3);c.fillText('FARMER BONUS!',G.W/2,G.H*0.3);c.font='900 20px system-ui';c.strokeText('+ his '+['sheep','pig','cow'][(G.li||0)%3]+' too!',G.W/2,G.H*0.3+30);c.fillText('+ his '+['sheep','pig','cow'][(G.li||0)%3]+' too!',G.W/2,G.H*0.3+30);c.restore()}})}},
    modifyGrowth(G,o,a){return o===F?a*0.3:a},
    drawHud(G,c){if(!F||!F.edible)return;c.font='900 16px system-ui';c.textAlign='center';c.fillStyle='#fff';c.fillText('🧑‍🌾 is snackable now! +500',G.W/2,G.H-90)}})}
// --- LEADERBOARD (local stub; replace save/load with server calls later) ---
if(FEATURES.leaderboard){const KEY='slyescape.lb';
  G.leaderboard={load:()=>JSON.parse(localStorage.getItem(KEY)||'[]'),submit(name,score,level){const l=this.load();l.push({name,score,level,at:Date.now()});l.sort((a,b)=>b.score-a.score);localStorage.setItem(KEY,JSON.stringify(l.slice(0,20)))}};
  G.use({levelEnd(G,r){if(r.win)G.leaderboard.submit('You',r.score,r.level+1)},
    init(G){const b=document.createElement('button');b.className='btn alt';b.textContent='Top Scores';$('menuExtra').appendChild(b);
      b.onclick=()=>alert(G.leaderboard.load().slice(0,10).map((e,i)=>(i+1)+'. '+e.name+' L'+e.level+' — '+e.score).join('\n')||'No scores yet')}})}
/* ===================== BOOT ===================== */
G.hook('init');requestAnimationFrame(frame);
</script></body></html>
