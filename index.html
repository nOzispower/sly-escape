<title>Sly Escape</title>
<!--
==========================================================================
 SLY ESCAPE - a single-file casual "swallow everything" game.

 HOW TO ADD / REMOVE THINGS
 1. FEATURES (just below, top of the <script>): flip a flag true/false.
    Each optional feature is a self-contained module in the MODULES section
    that registers with Game.use({...hooks}). When its flag is false the
    module is never registered, so the core game runs without it.
    Hooks a module may implement:
      init(G)            once at boot          levelStart(G,L)
      update(G,dt)       every frame           swallow(G,obj)  object eaten
      drawWorld(G,ctx)   world-space drawing   drawHud(G,ctx)  screen-space
      levelEnd(G,res)    win/lose result       menu(G,el)      add menu UI
      modifyGrowth(G,obj,amt) -> amt           modifyScore(G,obj,pts) -> pts
    To add a feature: add a flag, then `if(FEATURES.x) Game.use({...})`.
    To remove one entirely: delete its flag and its module block.
 2. LEVELS: 1-6 are hand-made entries; 7-100 come from generateLevels(),
    driven by THEMES (one farm theme per 10 levels), TUNING (difficulty
    ranges, capped so late levels stay beatable) and LEVEL_OVERRIDES (drop a
    hand-made level in by number). One level entry has these fields:
      name, time (sec), goal {type:'clear',pct} or {type:'size',r},
      size [w,h], ground [colA,colB], spawn [[typeId,count],...],
      farmer (chase speed, optional)
 3. OBJECT TYPES: one entry in OBJECT_TYPES. Fields:
      size (radius), pts, shape ('animal'|'ball'|'box'|'tree'|'car'|'house'|'cone'|'silo'|'crop'),
      color, color2 (accent), h (visual height), wander (speed, animals),
      kind (animal look: cat|dog|sheep|chick|duck|pig|goat|cow|horse).
    An object is swallowable only once hole radius > size/0.92, so big
    things (cows, horses, tractors, barns) need a bigger hole.
==========================================================================
-->

   ['🔥','Combos','Gobble things quickly one after another for a COMBO — keep the streak bar full: Nice → Great → Awesome → INSANE → LEGENDARY (bonus coins!).'],
   ['🪙','Coins & Magnet','Win levels to earn coins. Tap <b>🧲</b> (20 coins) to pull nearby small things into your mouth for 5 seconds.'],
   ['farmer','Watch out for the farmer!','He chases you waving a pitchfork. Each catch stuns your head briefly and costs time, getting worse each time: <b>-1s, -2s, -3s…</b> (resets every level). On gold <b>★ Bonus</b> levels a catch costs the time <b>and</b> shrinks your head a little!'],
   ['🐑','Turn the tables','Late in a level, once you are big, he panics, grabs an animal and runs. Gobble him and his animal for a <b>+500 FARMER BONUS</b>!'],
   ['🌍','Worlds & bonus levels','10 farm worlds with 10 levels each — meadow to giant ranch. Every 10th level is a gold <b>★ Bonus</b> level with its own upbeat music.'],
   ['🛒','Store','Spend the coins you earn on 10 new themed maps (each with its own chaser) and 13 fun creature heads (start as the free Grey Wolf). Heads are just for looks — no advantage.'],
   ['🏃','Get Ready & chasers','Tap a level to open <b>Get Ready</b>: pick your head and chaser, then hit Play. Buy extra chasers in the Store and use them on any map — they all play the same.'],
   ['🔊','Sound & music','<b>🔊</b> toggles sound effects, <b>🎵</b> toggles music. Your choice is remembered.'],
  ].filter(c=>!((c[0]==='⏱️'&&!FEATURES.timer)||(c[0]==='🔥'&&!FEATURES.combos)||(c[0]==='🪙'&&!FEATURES.boosters&&!FEATURES.coins)||((c[0]==='farmer'||c[0]==='🐑')&&!FEATURES.farmer)||(c[0]==='🔊'&&!FEATURES.sound&&!FEATURES.music)||(c[0]==='🛒'&&!FEATURES.store)||(c[0]==='🏃'&&!FEATURES.loadout)));
  function icon(kind){const c=document.createElement('canvas'),d=Math.min(3,devicePixelRatio||1);c.width=c.height=46*d;const x=c.getContext('2d');x.scale(d,d);
    if(kind==='hole'){const st={ang:0,chomp:0,chew:0};drawHoleBase(x,24,31,10,10*TILT,HEADS.default,0.5,false,st);drawHoleOver(x,24,31,10,10*TILT,HEADS.default,0.5,st);x.font='15px system-ui';x.fillText('👆',28,46)}
    else{x.translate(20,44);x.strokeStyle='#2b1838';x.lineWidth=1.2;G.drawFarmerIcon&&G.drawFarmerIcon(x)}
    return c}
  G.use({init(G){const b=document.createElement('button');b.className='btn alt';b.id='bHow';b.textContent='How to Play';$('menuExtra').prepend(b);
      const box=$('howCards');for(const[ic,t,p]of CARDS){const d=document.createElement('div');d.className='card';
        if(ic==='hole'||ic==='farmer')d.appendChild(icon(ic));else{const e=document.createElement('div');e.className='em';e.textContent=ic;d.appendChild(e)}
        const tx=document.createElement('div');tx.innerHTML='<b>'+t+'</b><p>'+p+'</p>';d.appendChild(tx);box.appendChild(d)}
      b.onclick=()=>{G.hook('userGesture');G.show('sHow');$('sHow').scrollTop=0};$('bHowBack').onclick=()=>G.show('sMenu')}})}
// --- STORE (maps + cosmetic heads + chasers, bought with coins only) ---
if(FEATURES.store){
  const S=G.save;
  // save migration: old hole skins -> heads (matching ones carried over, others refunded)
  {const old=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');if(old.ownedHoles&&!old.headsMigrated){const MAPH={alien:'alien',frog:'frog',shark:'shark',monster:'monster',rainbow:'unicorn',golden:'lion'};S.ownedHeads={default:true};let refund=0;
    for(const k of Object.keys(old.ownedHoles)){if(k==='default')continue;if(MAPH[k])S.ownedHeads[MAPH[k]]=true;else refund+=STORE_ITEMS._oldHoleRefund}
    S.coins=(S.coins||0)+refund;S.head=MAPH[old.hole]||'default';S.headsMigrated=true;S.migratedRefund=refund;delete S.ownedHoles;delete S.hole;G.persist()}}
  S.ownedMaps=S.ownedMaps||{};S.ownedHeads=Object.assign({default:true},S.ownedHeads||{});S.head=S.head&&HEADS[S.head]&&(FEATURES.unlockAll||S.ownedHeads[S.head])?S.head:'default';S.headsMigrated=true;S.mapUnlocked=S.mapUnlocked||{};S.ownedChasers=S.ownedChasers||{};S.chaser=S.chaser||'default';
  let tab='maps',previews=[],raf=0;
  const css=document.createElement('style');css.textContent=`
#sStore{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(env(safe-area-inset-top) + 16px) 14px 24px;gap:10px}
.stTabs{display:flex;gap:8px}.stTabs button{border:0;border-radius:14px;padding:9px 13px;font:900 17px system-ui;color:#fff;background:#ffffff22}.stTabs button.on{background:linear-gradient(#ffcf33,#ff8a00);box-shadow:0 4px 0 #b35500}
.stList{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
.stItem{background:#ffffff1c;border:2px solid #ffffff30;border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.stItem canvas{position:static;width:100%;height:auto;border-radius:12px}.stItem b{font-size:15px}
.stItem button{border:0;border-radius:12px;padding:7px 0;width:100%;font:900 15px system-ui;color:#fff;background:linear-gradient(#5dff9a,#14b35c);box-shadow:0 4px 0 #0a6b37}
.stItem button.owned{background:#ffffff33;box-shadow:none}.stItem button.eq{background:linear-gradient(#4fe3ff,#1e8cff);box-shadow:0 4px 0 #0a4fa8}
#stModal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:9}#stModal.on{display:flex}
#stModal>div{background:linear-gradient(#7b3cff,#4a1aa8);border:3px solid #fff8;border-radius:20px;padding:20px;width:290px;text-align:center;color:#fff;display:flex;flex-direction:column;gap:12px}
#stModal .btn{min-width:0;padding:10px 20px;font-size:18px}
#stToast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:#ff4a5a;color:#fff;font:900 18px system-ui;padding:12px 18px;border-radius:14px;z-index:10;display:none;box-shadow:0 6px 20px #0008;text-align:center}`;
  document.head.appendChild(css);
  const scr=document.createElement('div');scr.className='scr';scr.id='sStore';scr.innerHTML='<h2>Store</h2><div class="pill" id="stCoins" style="background:#0005;font-weight:900"></div><div class="stTabs"><button data-t="maps">🗺️ Maps</button><button data-t="heads">🐺 Heads</button><button data-t="chasers">🏃 Chasers</button></div><div class="stList" id="stList"></div><div class="dim" style="font-size:13px">Earn coins by winning levels. Heads and chasers are just for looks (✦ = a map&#39;s own chaser, free on its map).</div><button class="btn alt" id="stBack" style="flex-shrink:0">Back</button>';
  document.body.appendChild(scr);
  const modal=document.createElement('div');modal.id='stModal';modal.innerHTML='<div><h2 id="stMT" style="font-size:22px"></h2><div id="stMB"></div><div style="display:flex;gap:10px;justify-content:center"><button class="btn alt" id="stNo">Cancel</button><button class="btn" id="stYes">Buy</button></div></div>';document.body.appendChild(modal);
  const toast=document.createElement('div');toast.id='stToast';document.body.appendChild(toast);
  let back='sMenu';
  G.store={
    price:(kind,id)=>STORE_ITEMS[kind][id],
    owns:(kind,id)=>FEATURES.unlockAll?true:kind==='maps'?!!S.ownedMaps[id]:kind==='chasers'?(id==='default'||!!S.ownedChasers[id]):!!S.ownedHeads[id],
    buy(kind,id){if(this.owns(kind,id))return 'owned';const p=this.price(kind,id);if(p==null)return 'unknown';if(S.coins<p)return 'short';S.coins-=p;(kind==='maps'?S.ownedMaps:kind==='chasers'?S.ownedChasers:S.ownedHeads)[id]=true;G.persist();return 'ok'},
    equip(id){if(!HEADS[id]||!this.owns('heads',id))return false;S.head=id;G.persist();return true},
    equipChaser(id){if(!this.owns('chasers',id))return false;S.chaser=id;G.persist();return true},
    unlockAll(){MAPS.forEach(m=>S.ownedMaps[m.id]=true);Object.keys(HOLE_SKINS).forEach(k=>S.ownedHeads[k]=true);Object.keys(CHASERS).forEach(k=>S.ownedChasers[k]=true);G.persist()}, // test hook
    open(t){if(t)tab=t;back=document.querySelector('.scr.on')?.id||'sMenu';if(back==='sStore')back='sMenu';G.show('sStore');render();scr.scrollTop=0},
    toast(msg){toast.textContent=msg;toast.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>toast.style.display='none',1600)},
    confirm(title,body,yes){$('stMT').textContent=title;$('stMB').innerHTML=body;modal.classList.add('on');$('stYes').onclick=()=>{modal.classList.remove('on');yes()};$('stNo').onclick=()=>modal.classList.remove('on')},
  };
  function holePreview(id){const c=document.createElement('canvas'),d=Math.min(2,devicePixelRatio||1);c.width=150*d;c.height=100*d;const x=c.getContext('2d'),st={ang:0,chomp:0,chew:0};
    previews.push(t=>{x.setTransform(d,0,0,d,0,0);x.fillStyle='#8bdc5a';x.fillRect(0,0,150,100);x.fillStyle='#9be86a';for(let y=0;y<100;y+=20)x.fillRect(0,y,150,10);
      previewHead(x,75,66,19,HEADS[id],t,st,'🐔')});return c}
  function chaserPreview(id,w=150,h=100,host){const c=document.createElement('canvas'),d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;const x=c.getContext('2d');const ch=id==='default'?null:CHASERS[id];
    (host||previews).push(t=>{x.setTransform(d,0,0,d,0,0);x.fillStyle='#7a5ad8';x.fillRect(0,0,w,h);x.fillStyle='#8a6ae8';for(let y=0;y<h;y+=20)x.fillRect(0,y,w,10);
      if(!ch){x.font='900 '+(h*0.18)+'px system-ui';x.textAlign='center';x.fillStyle='#fff';x.fillText('🗺️ Map default',w/2,h*0.45);x.font='700 '+(h*0.12)+'px system-ui';x.fillText('farmer / map chaser',w/2,h*0.68);return}
      x.save();x.translate(w/2,h-6);x.lineJoin='round';if(G.drawChaserIcon)G.drawChaserIcon(x,ch,h*0.2,h*0.34);else x.drawImage(emojiSprite(ch.emoji),-h*0.3,-h*0.7,h*0.6,h*0.6);x.restore();
      const T=OBJECT_TYPES[ch.carry];if(T){const im=T.shape==='emoji'?emojiSprite(T.glyph):emojiSprite({cow:'🐄',cat:'🐈'}[ch.carry]||'🎁');x.drawImage(im,6,6,h*0.28,h*0.28);x.font='700 10px system-ui';x.fillStyle='#fff';x.textAlign='left';x.fillText('carries',6,h*0.28+16)}});return c}
  G.chaserPreview=chaserPreview;G.holePreview=(id,host)=>{const keep=previews;previews=host;const c=holePreview(id);previews=keep;return c};
  function loop(){if(!scr.classList.contains('on')){raf=0;return}const t=performance.now()/1000;previews.forEach(f=>f(t));raf=requestAnimationFrame(loop)}
  function render(){$('stCoins').textContent='🪙 '+S.coins;scr.querySelectorAll('.stTabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
    const list=$('stList');list.innerHTML='';previews=[];
    const items=tab==='maps'?MAPS.map(m=>({id:m.id,name:m.icon+' '+m.name,view:G.mapThumb(m,150,100)})):tab==='chasers'?['default',...Object.keys(CHASERS)].map(id=>({id,name:id==='default'?'Map default':CHASERS[id].name+(CHASERS[id].fromMap?' ✦':''),view:chaserPreview(id)})):Object.entries(HOLE_SKINS).map(([id,sk])=>({id,name:sk.name,view:holePreview(id)}));
    for(const it of items){const d=document.createElement('div');d.className='stItem';d.appendChild(it.view);const nm=document.createElement('b');nm.textContent=it.name;d.appendChild(nm);
      const b=document.createElement('button'),own=G.store.owns(tab,it.id),price=it.id==='default'?0:G.store.price(tab,it.id);
      if((tab==='heads'&&S.head===it.id)||(tab==='chasers'&&S.chaser===it.id)){b.textContent='✓ Equipped';b.className='eq'}else if(own){b.textContent=tab==='maps'?'Owned · Play':'Equip';b.className='owned'}else b.textContent='🪙 '+price;
      b.onclick=()=>{if(tab==='heads'&&own){G.store.equip(it.id);render();return}
        if(tab==='chasers'&&own){G.store.equipChaser(it.id);render();return}
        if(own){const mi=MAPS.findIndex(m=>m.id===it.id);G.renderSelect(FARM_PAGES+mi);G.show('sSelect');return}
        if(S.coins<price){G.store.toast('Not enough coins! Need 🪙 '+(price-S.coins)+' more.');return}
        G.store.confirm('Buy '+it.name+'?','Spend <b>🪙 '+price+'</b>? You have 🪙 '+S.coins+'.',()=>{const r=G.store.buy(tab,it.id);if(r==='ok'){if(tab==='heads')G.store.equip(it.id);if(tab==='chasers')G.store.equipChaser(it.id);G.sfx&&G.sfx(880,0.25,'triangle',0.1,400);G.store.toast('Unlocked '+it.name+'!');toast.style.background='#14b35c';setTimeout(()=>toast.style.background='',1700)}render()})};
      d.appendChild(b);list.appendChild(d)}
    if(!raf)raf=requestAnimationFrame(loop)}
  scr.querySelectorAll('.stTabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  $('stBack').onclick=()=>{back==='sSelect'?(G.renderSelect(),G.show('sSelect')):back==='sLoad'&&G.loadout?G.loadout.open(G.loadout.level):G.show(back)};
  G.use({init(G){const b=document.createElement('button');b.className='btn';b.id='bStore';b.textContent='🛒 Store';$('menuExtra').prepend(b);b.onclick=()=>{G.hook('userGesture');G.store.open()}},
    levelEnd(){if(G.coinEl)G.coinEl.textContent='🪙 '+S.coins}})}
// --- LOADOUT ('Get Ready' screen: choose head + chaser before a level) ---
if(FEATURES.loadout){
  const S=G.save;S.head=S.head||'default';S.chaser=S.chaser||'default';
  const css=document.createElement('style');css.textContent=`
#sLoad{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;padding:calc(env(safe-area-inset-top) + 16px) 12px 22px;gap:10px}
.ldRow{display:flex;gap:10px;overflow-x:auto;width:100%;max-width:440px;padding:4px 2px 10px;touch-action:pan-x;scroll-snap-type:x mandatory}
.ldCard{flex:0 0 112px;scroll-snap-align:start;background:#ffffff1c;border:3px solid #ffffff30;border-radius:16px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:900;position:relative}
.ldCard canvas{position:static;width:96px;height:64px;border-radius:10px}.ldCard.sel{border-color:#ffe14d;background:#ffe14d33;box-shadow:0 0 14px #ffe14d88}
.ldCard.lock{opacity:.5}.ldCard.lock::after{content:'🔒 Get in Store';position:absolute;bottom:6px;left:0;right:0;font-size:11px;color:#ffe14d}
.ldCard.lock span{visibility:hidden}.ldH{align-self:flex-start;max-width:440px;width:100%;margin:0 auto;font-weight:900;font-size:17px;text-align:left}`;
  document.head.appendChild(css);
  const scr=document.createElement('div');scr.className='scr';scr.id='sLoad';scr.innerHTML='<h2>Get Ready!</h2><div id="ldLv" class="dim" style="font-weight:900"></div><div class="ldH">🐺 Head</div><div class="ldRow" id="ldHoles"></div><div class="ldH">🏃 Chaser</div><div class="ldRow" id="ldChasers"></div><button class="btn" id="ldPlay" style="font-size:28px;padding:16px 50px;flex-shrink:0">▶ PLAY</button><button class="btn alt" id="ldBack" style="flex-shrink:0">Back</button>';
  document.body.appendChild(scr);
  let anim=[],raf=0;
  function loop(){if(!scr.classList.contains('on')){raf=0;return}const t=performance.now()/1000;anim.forEach(f=>f(t));raf=requestAnimationFrame(loop)}
  function card(row,view,label,sel,owned,onPick,storeTab){const d=document.createElement('div');d.className='ldCard'+(sel?' sel':'')+(owned?'':' lock');d.appendChild(view);const s=document.createElement('span');s.textContent=label;d.appendChild(s);
    d.onclick=()=>{if(!owned){if(G.store)G.store.open(storeTab);return}onPick();G.loadout.open(G.loadout.level)};row.appendChild(d)}
  function simpleHole(id){const st={};const c=document.createElement('canvas');c.width=192;c.height=128;const x=c.getContext('2d');anim.push(t=>{x.setTransform(2,0,0,2,0,0);x.fillStyle='#8bdc5a';x.fillRect(0,0,96,64);previewHead(x,48,44,13,HEADS[id],t,st,'🐣')});return c}
  G.loadout={level:0,
    open(i){this.level=i;anim=[];const L=LEVELS[i];$('ldLv').textContent=(L.map?(L.mapDef.icon+' '):'')+'Level '+(i%10+1+(L.map?0:Math.floor(i/10)*10))+' · '+L.name;
      const hr=$('ldHoles'),cr=$('ldChasers');hr.innerHTML='';cr.innerHTML='';
      for(const[id,sk]of Object.entries(HOLE_SKINS)){const own=id==='default'||(G.store&&G.store.owns('heads',id));card(hr,G.holePreview?G.holePreview(id,anim):simpleHole(id),sk.name,S.head===id,own,()=>{S.head=id;G.persist()},'heads')}
      for(const id of ['default',...Object.keys(CHASERS)]){const own=id==='default'||(G.store&&G.store.owns('chasers',id));const ch=CHASERS[id];
        const view=G.chaserPreview?G.chaserPreview(id,96,64,anim):(()=>{const c=document.createElement('canvas');return c})();
        card(cr,view,id==='default'?(L.chaser?(CHASERS[L.chaser.id]||{}).name||'Map chaser':'Farmer')+' (default)':ch.name,S.chaser===id,own,()=>{S.chaser=id;G.persist()},'chasers')}
      G.show('sLoad');if(!raf)raf=requestAnimationFrame(loop);
      setTimeout(()=>{for(const r of[hr,cr]){const s=r.querySelector('.sel');if(s)r.scrollLeft=s.offsetLeft-r.offsetLeft-10}},0)},
    play(){G.startLevel(this.level)}};
  $('ldPlay').onclick=()=>{G.hook('userGesture');G.loadout.play()};$('ldBack').onclick=()=>{G.renderSelect();G.show('sSelect')};}
// --- LEADERBOARD (local stub; replace save/load with server calls later) ---
if(FEATURES.leaderboard){const KEY='slyescape.lb';
  G.leaderboard={load:()=>JSON.parse(localStorage.getItem(KEY)||'[]'),submit(name,score,level){const l=this.load();l.push({name,score,level,at:Date.now()});l.sort((a,b)=>b.score-a.score);localStorage.setItem(KEY,JSON.stringify(l.slice(0,20)))}};
  G.use({levelEnd(G,r){if(r.win)G.leaderboard.submit('You',r.score,r.level+1)},
    init(G){const b=document.createElement('button');b.className='btn alt';b.textContent='Top Scores';$('menuExtra').appendChild(b);
      b.onclick=()=>alert(G.leaderboard.load().slice(0,10).map((e,i)=>(i+1)+'. '+e.name+' L'+e.level+' — '+e.score).join('\n')||'No scores yet')}})}
// title art: the Grey Wolf head chomping a chick
{const tc=$('titleArt'),tx=tc.getContext('2d'),st={ang:0.4,chomp:0,chew:0};(function anim(){if($('sMenu').classList.contains('on')){const t=performance.now()/1000,k=(t*0.8)%1;tx.setTransform(2,0,0,2,0,0);tx.clearRect(0,0,220,150);
  previewHead(tx,110,104,34,HEADS.default,t,st,'🐔')}requestAnimationFrame(anim)})()}
/* ===================== BOOT ===================== */
G.hook('init');requestAnimationFrame(frame);
</script></body></html>
